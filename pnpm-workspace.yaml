packages:
  - packages/*
nodeLinker: hoisted
verifyDepsBeforeRun: error
# A dependency is written at the exact version installed, and an engine a package refuses fails the install.
saveExact: true
engineStrict: true
# Node 26 is the one runtime, so its types are the only Node types, even for packages that ask for another.
overrides:
  "@types/node": "catalog:"
allowBuilds:
  lefthook: true
  esbuild: true
# Approved dependencies' agent skills link into the one skills folder, which .claude/skills and .cursor/skills link to.
skills:
  dirs:
    - .agents/skills
# Admit a release once it is a day old.
minimumReleaseAge: 1440
# Every external dependency's one version: packages name it with catalog:, and strict mode refuses a version stated anywhere else.
catalogMode: strict
catalog:
  "@aidenzepp/effect-xml": 0.2.0
  "@effect/platform-node": 4.1.2
  "@effect/tsgo": 0.64.1
  "@effect/vitest": 4.1.2
  "@types/node": 26.6.6
  arkregex: 0.0.14
  effect: 4.1.2
  esbuild: 0.28.1
  fallow: 3.38.1
  lefthook: 2.2.1
  oxfmt: 0.76.0
  oxlint: 1.90.0
  oxlint-tsgolint: 7.0.2005
  turbo: 2.11.10
  typescript: 7.1.0-beta
  vite: 8.3.5
  vitest: 5.1.0
permissions:
  fallow:
    skills: true
